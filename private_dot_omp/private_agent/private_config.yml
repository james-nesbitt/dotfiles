modelRoles:
  designer: anthropic/claude-opus-5:auto
  advisor: anthropic/claude-opus-5:auto
  plan: anthropic/claude-opus-5:auto
  default: anthropic/claude-sonnet-5
memories:
  minRolloutIdleHours: 6
  maxRolloutAgeDays: 30
  summaryInjectionTokenLimit: 5000
disabledExtensions:
  - rule:kairos-mirantis
hideThinkingBlock: true
todo:
  eager: always
grep:
  contextBefore: 1
  contextAfter: 1
checkpoint:
  enabled: true
async:
  enabled: true
mcp:
  {}
task:
  isolation:
    merge: patch
    commits: ai
    enabled: true
  maxConcurrency: 8
  eager: default
secrets:
  enabled: true
readLineNumbers: true
lsp:
  diagnosticsOnEdit: true
python:
  kernelMode: session
  sharedGateway: true
steeringMode: all
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  noEmbeddings: true
  llmMode: smol
symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 2
providers:
  tinyModel: lfm2.5-350m
  memoryModel: qwen3-1.7b
  autoThinkingModel: qwen3-1.7b
defaultThinkingLevel: auto
retry:
  fallbackChains:
    default:
      - anthropic/claude-opus-5
    anthropic/*:
      - anthropic/claude-sonnet-5
composer:
  shape: box
dev:
  autoqaConsent: granted
isolation:
  backend: rcopy