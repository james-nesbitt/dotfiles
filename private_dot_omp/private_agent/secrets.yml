# ~/.omp/agent/secrets.yml
# Secret obfuscation patterns for Mirantis service credentials.
#
# These patterns are a defense-in-depth layer. Primary protection is that
# credentials live in `pass` and never enter the agent environment at all.
# These patterns catch any value that leaks through anyway (e.g. pass output
# captured in a tool result, a stray env var, or a config file read).
#
# Mode `obfuscate` (default): replaced with a reversible placeholder like #AB12#
# so the agent can still pass it through to tool arguments without seeing the value.

# GitLab personal access tokens — always prefixed glpat-
- type: regex
  content: "glpat-[A-Za-z0-9_-]{20,}"

# Jenkins API tokens — 32-char hex strings (the format Jenkins generates)
- type: regex
  content: "[0-9a-f]{32}"

# Atlassian API tokens (JIRA / Confluence) — base64url, 24+ chars
# Atlassian tokens are ~40 chars of base64 with no obvious prefix; catch them
# by length + charset when they appear after common field names in output.
- type: regex
  content: "(?i)(api[_-]?token|authorization)[\"']?\\s*[:=]\\s*[\"']?[A-Za-z0-9+/=_-]{24,}"

# Bearer tokens in Authorization headers (any service)
- type: regex
  content: "/Bearer\\s+[A-Za-z0-9._~+\\/=-]{16,}/i"

# Basic auth credentials in URLs — user:pass@host
- type: regex
  content: "//[^@\\s]{4,}@"
  mode: replace
  replacement: "//**REDACTED**@"
